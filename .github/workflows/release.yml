name: Build and release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Optional: set secrets KEYSTORE_BASE64, KS_PASS, KEY_ALIAS to sign releases with a
      # stable key (so updates install over older releases). Otherwise a throwaway key is used.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=${{ secrets.KS_PASS }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: adbwifi-apk
          path: build/adbwifi.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/adbwifi.apk "adbwifi-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "adbwifi-${GITHUB_REF_NAME}.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
